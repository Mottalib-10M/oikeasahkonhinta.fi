name: Päivitä hinnat ja julkaise

# Rakennetaan ja julkaistaan jokaisella pushilla sekä automaattisesti kolmesti päivässä:
#  - 11:00 ja 12:00 UTC: huomisen pörssihinnat (julkaistaan noin 13:45 Suomen aikaa) ;
#  - 21:05 ja 22:05 UTC: Suomen keskiyö (kesä- ja talviaika), huominen vaihtuu tähän päivään.
# Hintalähde: ENTSO-E, jos salaisuus ENTSOE_TOKEN on asetettu; muuten Nord Poolin julkinen rajapinta.
# Jos päivän hintoja ei saada, sivusto näyttää merkityn keskihinta-arvion (scripts/data/rakenna-spot.mjs).
on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '5 21 * * *'
    - cron: '5 22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Pörssihinnat (eilen, tänään, huomenna) ja kuukausikeskiarvot
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          node scripts/data/hae-spot.mjs || echo "spot: haku epäonnistui, käytetään arkistoa ja arviota"
          node scripts/data/hae-spot.mjs --kuukaudet || echo "kuukausikeskiarvot: haku epäonnistui"
      - name: Viikoittaiset viitetiedot (maanantaisin)
        if: github.event_name == 'schedule' && github.event.schedule == '0 11 * * *'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            node scripts/data/hae-sopimukset.mjs || true
            node scripts/data/hae-tilastokeskus.mjs || true
            node scripts/data/hae-postinumerot.mjs || true
          fi
      - name: Hintatiedostot sivustolle
        run: node scripts/data/rakenna-spot.mjs
      - name: Tallenna arkisto
        run: |
          git config user.name "kokosahko-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data src/data public/data
          git diff --cached --quiet || git commit -m "Pörssihinnat $(date -u +%F' '%H:%M) UTC"
          git push || echo "push epäonnistui, arkisto tallennetaan seuraavalla ajolla"
      - name: Tests du moteur
        run: npx vitest run
      - name: Build (avec contrôle des snippets)
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
